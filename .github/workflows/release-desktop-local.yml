name: AgencyAI Desktop Beta Release

# PLAN_AGENCYAI_DESKTOP_MVP.md PR08/G7.
# This is the only AgencyAI desktop publisher. It intentionally produces a
# draft prerelease and fails closed unless Developer ID signing and Apple
# notarization both succeed on the exact tagged commit.

on:
  push:
    tags:
      - "agencyai-desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agencyai-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWORK_PRODUCT_PROFILE: local-mvp
  VITE_OPENWORK_PRODUCT_PROFILE: local-mvp
  VITE_OPENWORK_POSTHOG_KEY: ""
  OPENCODE_VERSION: "1.17.11"
  OPENCODE_CHANNEL: latest
  OPENCODE_DISABLE_AUTOUPDATE: "1"
  OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "1"
  OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
  OPENCODE_ENABLE_OPENAI_OAUTH: "1"
  OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
  OPENCODE_DISABLE_MODELS_FETCH: "1"
  OPENCODE_DISABLE_PROJECT_CONFIG: "1"
  OPENCODE_DISABLE_REMOTE_CONFIG: "1"
  OPENCODE_DISABLE_REMOTE_INSTRUCTIONS: "1"
  OPENCODE_DISABLE_REMOTE_SKILLS: "1"
  OPENCODE_DISABLE_RUNTIME_DOWNLOADS: "1"
  OPENCODE_DISABLE_SHARE: "1"
  OPENCODE_ENABLE_EXA: "0"
  OPENCODE_TRUSTED_PLUGIN_PATHS: "[]"

jobs:
  release:
    name: Sign, notarize, verify, and stage beta
    if: github.repository == 'artreimus/AgencyAI'
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require an exact AgencyAI release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          node scripts/release/verify-local-tag.mjs "$GITHUB_REF_NAME"
          node scripts/release/review-local-release.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require Apple signing and notarization secrets
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CODESIGN_CERT_P12_BASE64 \
            APPLE_CODESIGN_CERT_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_NOTARY_API_KEY_ID \
            APPLE_NOTARY_API_ISSUER_ID \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing AgencyAI macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          test "${#APPLE_TEAM_ID}" -eq 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run exact local MVP release gates
        run: pnpm test:local

      - name: Build exact pinned OpenCode runtime
        run: bash scripts/release/build-pinned-opencode-macos.sh

      - name: Import Developer ID certificate and notarization key
        id: signing
        shell: bash
        env:
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/agencyai-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/agencyai-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CODESIGN_CERT_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CODESIGN_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security default-keychain -s "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
              | head -1
          )"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi

          {
            echo "identity=$identity"
            echo "keychain=$keychain_path"
            echo "notary-key=$notary_key_path"
          } >> "$GITHUB_OUTPUT"

      - name: Build signed and notarized macOS app, DMG, and ZIP
        env:
          MACOS_NOTARIZE: "true"
          CSC_NAME: ${{ steps.signing.outputs.identity }}
          CSC_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.notary-key }}
          AGENCYAI_EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENWORK_COMPUTER_USE_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: pnpm package:local

      - name: Sign, notarize, and staple the DMG
        shell: bash
        env:
          AGENCYAI_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          AGENCYAI_CODESIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.notary-key }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' apps/desktop/package.json)"
          dmg="apps/desktop/dist-electron/agencyai-mac-arm64-${version}.dmg"
          test -f "$dmg"

          codesign \
            --force \
            --keychain "$AGENCYAI_CODESIGN_KEYCHAIN" \
            --sign "$AGENCYAI_CODESIGN_IDENTITY" \
            --timestamp \
            "$dmg"
          codesign --verify --strict --verbose=4 "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"

      - name: Verify the exact app, DMG, and ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' apps/desktop/package.json)"
          app="apps/desktop/dist-electron/mac-arm64/agencyai.app"
          dmg="apps/desktop/dist-electron/agencyai-mac-arm64-${version}.dmg"
          zip="apps/desktop/dist-electron/agencyai-mac-arm64-${version}.zip"

          codesign --verify --deep --strict --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          node apps/desktop/scripts/inspect-local-artifact.mjs "$app" "$dmg" "$zip"

          extracted="$RUNNER_TEMP/agencyai-zip"
          mkdir -p "$extracted"
          ditto -x -k "$zip" "$extracted"
          zip_app="$extracted/agencyai.app"
          test -d "$zip_app"
          cmp \
            "$app/Contents/Resources/release-metadata/release-manifest.json" \
            "$zip_app/Contents/Resources/release-metadata/release-manifest.json"
          codesign --verify --deep --strict --verbose=4 "$zip_app"
          xcrun stapler validate "$zip_app"
          spctl --assess --type execute --verbose=4 "$zip_app"

      - name: Stage checksums, SBOMs, notices, and provenance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/stage-macos-release-assets.mjs \
            --tag "$GITHUB_REF_NAME"
          (
            cd apps/desktop/dist-electron/release-assets
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload immutable workflow evidence
        uses: actions/upload-artifact@v4
        with:
          name: agencyai-desktop-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: apps/desktop/dist-electron/release-assets/

      - name: Create or update the draft GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' apps/desktop/package.json)"
          notes=".github/release-notes/agencyai-desktop-v${version}.md"
          assets=(apps/desktop/dist-electron/release-assets/*)
          test -f "$notes"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft,isPrerelease \
                --jq '.isDraft and .isPrerelease'
            )" = "true"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "AgencyAI Desktop v${version}" \
              --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "AgencyAI Desktop v${version}" \
              --notes-file "$notes" \
              "${assets[@]}"
          fi

      - name: Verify uploaded release hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uploaded="$RUNNER_TEMP/agencyai-uploaded-release"
          mkdir -p "$uploaded"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$uploaded"
          (
            cd "$uploaded"
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keychain="${{ steps.signing.outputs.keychain }}"
          if [ -n "$keychain" ] && [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f \
            "$RUNNER_TEMP/agencyai-developer-id.p12" \
            "$RUNNER_TEMP/AuthKey.p8"
