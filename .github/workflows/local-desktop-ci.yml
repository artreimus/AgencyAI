name: AgencyAI Local Desktop CI

on:
  pull_request:
  push:
    branches:
      - dev
      - "codex/agencyai-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agencyai-local-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWORK_PRODUCT_PROFILE: local-mvp
  VITE_OPENWORK_PRODUCT_PROFILE: local-mvp

jobs:
  fast:
    name: Local profile policy and tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:local

  packaged:
    name: Ad-hoc packaged macOS arm64 proof
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
      - name: Build exact pinned OpenCode runtime
        env:
          OPENCODE_VERSION: "1.17.11"
          OPENCODE_CHANNEL: latest
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          OPENCODE_DISABLE_CLAUDE_CODE_SKILLS: "1"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
          OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
          OPENCODE_DISABLE_MODELS_FETCH: "1"
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          OPENCODE_DISABLE_REMOTE_CONFIG: "1"
          OPENCODE_DISABLE_REMOTE_INSTRUCTIONS: "1"
          OPENCODE_DISABLE_REMOTE_SKILLS: "1"
          OPENCODE_DISABLE_RUNTIME_DOWNLOADS: "1"
          OPENCODE_DISABLE_SHARE: "1"
          OPENCODE_ENABLE_EXA: "0"
          OPENCODE_TRUSTED_PLUGIN_PATHS: "[]"
        run: |
          set -euo pipefail
          # Bun embeds dependency paths, so the reviewed checkout root is a
          # byte-for-byte build input alongside the commit and toolchain.
          source_root="$(dirname "$RUNNER_WORKSPACE")/AgencyAI-OpenCode/AgencyAI-OpenCode"
          output_binary="$RUNNER_TEMP/agencyai-opencode"
          source_repository="$(jq -r '.sourceRepository' opencode-distribution.json)"
          source_commit="$(jq -r '.forkCommit' opencode-distribution.json)"
          binary_version="$(jq -r '.binaryVersion' opencode-distribution.json)"
          expected_hash="$(jq -r '.targetAssets["aarch64-apple-darwin"].sourceBinarySha256' opencode-distribution.json)"

          test "$source_repository" = "https://github.com/artreimus/AgencyAI-OpenCode"
          test "$OPENCODE_VERSION" = "$binary_version"
          test "$source_root" = "/Users/runner/work/AgencyAI-OpenCode/AgencyAI-OpenCode"
          test ! -e "$source_root"
          mkdir -p "$source_root"
          git -C "$source_root" init --quiet
          git -C "$source_root" remote add origin "$source_repository"
          git -C "$source_root" fetch --depth=1 origin "$source_commit"
          git -C "$source_root" checkout --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$source_commit"

          (
            cd "$source_root"
            bun install --frozen-lockfile
            bun packages/opencode/script/build.ts --single --skip-embed-web-ui --skip-install
          )
          runtime_binary="$source_root/packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
          test -x "$runtime_binary"
          test "$("$runtime_binary" --version)" = "$binary_version"
          file "$runtime_binary" | grep -q "arm64"
          codesign --force --sign - "$runtime_binary"
          codesign --verify --strict --verbose=2 "$runtime_binary"
          test "$(shasum -a 256 "$runtime_binary" | awk '{print $1}')" = "$expected_hash"
          install -m 755 "$runtime_binary" "$output_binary"
          printf "AGENCYAI_VERIFIED_OPENCODE_BINARY_PATH=%s\n" "$output_binary" >> "$GITHUB_ENV"
      - run: pnpm package:local:dir
      - run: pnpm inspect:local
      - run: pnpm --filter @openwork/desktop smoke:native
      - run: pnpm --filter @openwork/desktop smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: agencyai-local-proof-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist-electron/mac-arm64/agencyai.app/Contents/Resources/release-metadata
            evals/results
